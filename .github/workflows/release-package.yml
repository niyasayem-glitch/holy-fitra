name: Holy Fitra release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holyfitra-release-package-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  RELEASE_ARCHIVE: dist/holyfitra-v1.0.0-host.tar.gz

jobs:
  build-verify-package:
    name: Build and verify release package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate patch and script syntax
        run: |
          git diff --check
          bash -n holyfitra holyfitra-v1.sh termux-build.sh make-holyfitra-v1-release.sh ci/verify_release_package.sh
          python -m py_compile holyfitra_*.py hyperc_*.py test_*.py

      - name: Build and verify release package
        env:
          RELEASE_ARCHIVE: ${{ env.RELEASE_ARCHIVE }}
        run: |
          chmod +x ci/verify_release_package.sh
          bash ci/verify_release_package.sh "$RELEASE_ARCHIVE"
          test -s "$RELEASE_ARCHIVE"
          test -s "$RELEASE_ARCHIVE.sha256"

      - name: Upload verified release package
        uses: actions/upload-artifact@v4
        with:
          name: holyfitra-v1-host-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_ARCHIVE }}.sha256
