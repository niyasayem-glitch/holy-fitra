name: Promote high-risk Holy Fitra change

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Existing high-risk/** branch to validate and promote'
        required: true
        type: string
      confirmation:
        description: 'Type PROMOTE to permit promotion after validation'
        required: true
        type: string
      reason:
        description: 'Short reason and expected benefit for this promotion'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: high-risk-promotion-master
  cancel-in-progress: false

jobs:
  validate:
    name: Validate high-risk branch
    if: ${{ inputs.confirmation == 'PROMOTE' && startsWith(inputs.source_branch, 'high-risk/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out high-risk branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run full validation
        run: |
          git diff --check origin/master...HEAD
          bash -n holyfitra holyfitra-v1.sh termux-build.sh make-holyfitra-v1-release.sh
          python -m py_compile holyfitra_*.py hyperc_*.py test_*.py
          python -m unittest -q
          bash termux-build.sh test --native-tests
          bash make-holyfitra-v1-release.sh /tmp/holyfitra-high-risk-release.tar.gz

      - name: Run 300-iteration high-risk campaign
        run: |
          python holy_fitra_self_improve.py --iterations 300 --output /tmp/holyfitra-high-risk-300.json
          grep -q '"iterations": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"requested_iterations": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"passed_correctness": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"passed_safety": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"passed_determinism": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"retained_count": 300' /tmp/holyfitra-high-risk-300.json
          grep -q '"rejected_count": 0' /tmp/holyfitra-high-risk-300.json

      - name: Record promotion evidence
        run: |
          {
            echo "source_branch=${{ inputs.source_branch }}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "reason=${{ inputs.reason }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Merge validated high-risk branch into master
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.confirmation == 'PROMOTE' && startsWith(inputs.source_branch, 'high-risk/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge validated branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          PROMOTION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git merge --no-ff --no-edit "origin/${SOURCE_BRANCH}" \
            -m "promote: validated high-risk change" \
            -m "Reason: ${PROMOTION_REASON}"
          git push origin HEAD:master

      - name: Write promotion summary
        run: |
          {
            echo "### High-risk promotion complete"
            echo "Source branch: `${{ inputs.source_branch }}`"
            echo "Target branch: `master`"
            echo "Promotion used the validated branch merge after all gates passed."
          } >> "$GITHUB_STEP_SUMMARY"

  rejected:
    name: Reject invalid promotion request
    if: ${{ !(inputs.confirmation == 'PROMOTE' && startsWith(inputs.source_branch, 'high-risk/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain rejection
        run: |
          echo "Promotion refused: source_branch must start with high-risk/ and confirmation must equal PROMOTE." >&2
          exit 1
