name: Holy Fitra validation

on:
  push:
    branches:
      - master
      - 'safe/**'
      - 'high-risk/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holyfitra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full host and Termux-compatible validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install Python package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Validate patch, shell, and Python syntax
        run: |
          git diff --check
          bash -n holyfitra holyfitra-v1.sh termux-build.sh make-holyfitra-v1-release.sh
          python -m py_compile holyfitra_*.py hyperc_*.py test_*.py

      - name: Run complete regression gate
        run: bash termux-build.sh test --native-tests
