name: HD provider secret check

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Select the provider whose repository secret should be checked.
        required: true
        type: choice
        options:
          - openrouter
          - gemini
          - cerebras
          - groq
          - cohere

permissions:
  contents: read

jobs:
  check-selected-secret:
    name: Check selected HD secret without calling a provider
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HD_SELECTED_PROVIDER: ${{ inputs.provider }}
      HD_OPENROUTER_API_KEY: ${{ secrets.HD_OPENROUTER_API_KEY }}
      HD_GEMINI_API_KEY: ${{ secrets.HD_GEMINI_API_KEY }}
      HD_CEREBRAS_API_KEY: ${{ secrets.HD_CEREBRAS_API_KEY }}
      HD_GROQ_API_KEY: ${{ secrets.HD_GROQ_API_KEY }}
      HD_COHERE_API_KEY: ${{ secrets.HD_COHERE_API_KEY }}
    steps:
      - name: Confirm the selected repository secret is available
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          secret_names = {
              "openrouter": "HD_OPENROUTER_API_KEY",
              "gemini": "HD_GEMINI_API_KEY",
              "cerebras": "HD_CEREBRAS_API_KEY",
              "groq": "HD_GROQ_API_KEY",
              "cohere": "HD_COHERE_API_KEY",
          }
          provider = os.environ["HD_SELECTED_PROVIDER"]
          secret_name = secret_names[provider]
          if not os.environ.get(secret_name):
              raise SystemExit(f"Missing repository secret: {secret_name}")
          print(f"Repository secret is available for selected HD provider: {provider}")
          PY
